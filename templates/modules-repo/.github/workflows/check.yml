name: Check modules

# Scans and loads every module with the latest Uroboros from PyPI, as `.dlm` would on install.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch breakage from new Uroboros releases

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uroboros-userbot
      - run: python tools/check_modules.py
