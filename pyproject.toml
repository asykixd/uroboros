[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uroboros-userbot"
version = "1.1.0-dev"
description = "Modular Telegram userbot on Telethon"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["telethon>=1.40,<2", "aiogram>=3.20,<4", "qrcode>=7.4"]
keywords = ["telegram", "userbot", "telethon", "hikka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/asykixd/uroboros"
Documentation = "https://asykixd.github.io/uroboros/"
Changelog = "https://github.com/asykixd/uroboros/releases"
Issues = "https://github.com/asykixd/uroboros/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
uroboros = "uroboros.main:main"

[tool.setuptools.packages.find]
include = ["uroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["uroboros"]

[tool.coverage.report]
# A little below the measured value (85.5%), so a platform difference doesn't fail CI; raise it as tests grow.
fail_under = 84

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.10"
files = ["uroboros"]
# The Hikka adapter mirrors Hikka's untyped API on purpose.
exclude = ["^uroboros/hikka/"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "uroboros.hikka.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Neither ships type information (no py.typed, no stubs on PyPI for Telethon 1.x).
module = ["telethon.*", "qrcode.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# A method named `list` shadows the builtin in later annotations of the class, and mypy reads them as
# the method. Renaming would change the public signatures (tests/api_snapshot.json).
module = "uroboros.inline"
disable_error_code = ["valid-type", "index"]

[[tool.mypy.overrides]]
# Same `list` shadowing; also, the client is None only in offline tests, which never reach the code using it.
module = "uroboros.inline.manager"
disable_error_code = ["valid-type", "index", "union-attr"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Doc code snippets are short and partial; the formatter leaves them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The bot UI is Russian: Cyrillic in strings and comments is expected.
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Module strings is a plain class dict, as in Hikka.
"examples/*" = ["RUF012"]
"uroboros/modules/*" = ["RUF012"]
"templates/*" = ["RUF012"]
"tests/hikka/*" = ["RUF012"]
