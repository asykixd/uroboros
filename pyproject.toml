[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uroboros-userbot"
version = "1.0.1-dev"
description = "Modular Telegram userbot on Telethon"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["telethon>=1.40,<2", "aiogram>=3.20,<4", "qrcode>=7.4"]
keywords = ["telegram", "userbot", "telethon", "hikka"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/asykixd/uroboros"
Documentation = "https://asykixd.github.io/uroboros/"
Changelog = "https://github.com/asykixd/uroboros/releases"
Issues = "https://github.com/asykixd/uroboros/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
uroboros = "uroboros.main:main"

[tool.setuptools.packages.find]
include = ["uroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py310"
# Doc code snippets are short and partial; the formatter leaves them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The bot UI is Russian: Cyrillic in strings and comments is expected.
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Module strings is a plain class dict, as in Hikka.
"examples/*" = ["RUF012"]
"tests/hikka/*" = ["RUF012"]
