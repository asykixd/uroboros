name: Hikka compatibility

# The script executes third-party modules: run it only on a disposable GitHub runner, never locally.
# Two jobs on purpose: `compat` runs untrusted code with a read-only token that isn't even kept in .git/config;
# `publish` never runs that code, it only takes the two Markdown tables and opens a pull request.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Modules per repository (empty = all)"
        required: false
      publish:
        description: "Open a pull request with the tables"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - env:
          LIMIT: ${{ inputs.limit }}
        run: python scripts/hikka_compat.py ${LIMIT:+--limit "$LIMIT"}
      - uses: actions/upload-artifact@v4
        with:
          name: hikka-compat
          path: |
            docs/hikka-compat.md
            docs/hikka-compat.ru.md
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: compat
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hikka-compat
          path: compat
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: hikka-compat/${{ github.run_id }}
        run: |
          # Only the two expected files are taken from the artifact, whatever else it contains.
          cp compat/hikka-compat.md docs/hikka-compat.md
          cp compat/hikka-compat.ru.md docs/hikka-compat.ru.md
          if git diff --quiet -- docs/hikka-compat.md docs/hikka-compat.ru.md; then
            echo "Tables unchanged, nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/hikka-compat.md docs/hikka-compat.ru.md
          git commit -m "docs: update the hikka compatibility table"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "docs: update the hikka compatibility table" \
            --body "Generated by the Hikka compatibility workflow (run ${{ github.run_id }}). Review the tables before merging."
