name: Hikka compatibility

# The script executes third-party modules: run it only on a disposable GitHub runner, never locally.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Modules per repository (empty = all)"
        required: false

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/hikka_compat.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: hikka-compat
          path: docs/hikka-compat.md
