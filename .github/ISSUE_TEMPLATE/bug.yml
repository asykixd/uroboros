name: 🐞 Bug
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Vulnerabilities go privately, see SECURITY.md. Don't attach your session, config.json or logs with personal data. English or Russian is fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. .dlm ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version and OS
      description: From .info — Uroboros and Python versions, OS (Linux, Termux, Docker, Windows, macOS)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error or log
      description: Error text from the bot or a log excerpt (.logs error)
      render: text
