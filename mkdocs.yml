site_name: Uroboros
site_description: Модульный юзербот для Telegram на Python и Telethon
site_url: https://asykixd.github.io/uroboros/
repo_url: https://github.com/asykixd/uroboros
repo_name: asykixd/uroboros
edit_uri: edit/dev/docs/
copyright: AGPL-3.0

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Главная: README.md
  - Установка: install.md
  - Команды: commands.md
  - Безопасность: security.md
  - Для авторов модулей:
      - Как писать модули: modules.md
      - Примеры: examples.md
      - Стабильность API: stability.md
  - Модули Hikka и FTG:
      - Адаптер: hikka.md
      - Совместимость: hikka-compat.md
