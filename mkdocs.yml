site_name: Uroboros
site_description: Modular Telegram userbot on Python and Telethon
site_url: https://asykixd.github.io/uroboros/
repo_url: https://github.com/asykixd/uroboros
repo_name: asykixd/uroboros
edit_uri: edit/dev/docs/
copyright: AGPL-3.0

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asykixd/uroboros
      name: Uroboros on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/uroboros-userbot/
      name: uroboros-userbot on PyPI

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Модульный юзербот для Telegram на Python и Telethon
          nav_translations:
            Home: Главная
            Install: Установка
            Commands: Команды
            Security: Безопасность
            Module authors: Для авторов модулей
            Writing modules: Как писать модули
            Examples: Примеры
            API stability: Стабильность API
            Hikka and FTG modules: Модули Hikka и FTG
            Adapter: Адаптер
            Compatibility: Совместимость

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Install: install.md
  - Commands: commands.md
  - Security: security.md
  - Module authors:
      - Writing modules: modules.md
      - Examples: examples.md
      - API stability: stability.md
  - Hikka and FTG modules:
      - Adapter: hikka.md
      - Compatibility: hikka-compat.md
