# Start:  docker compose up -d && docker compose logs -f   (login panel link is in the logs)
# Update: git pull && docker compose up -d --build
services:
  uroboros:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      # Login panel from this machine only; from elsewhere use ssh -L 8080:127.0.0.1:8080
      - "127.0.0.1:8080:8080"
    environment:
      - UROBOROS_API_ID
      - UROBOROS_API_HASH
      - UROBOROS_BOT_TOKEN
